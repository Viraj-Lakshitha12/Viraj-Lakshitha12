<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#0d0d1f"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <linearGradient id="accentF" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glowF">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softF">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <style>
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes shimmerMove {
        0% { transform: translateX(-200px); }
        100% { transform: translateX(1100px); }
      }
      @keyframes dotFade {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      .sub { animation: fadeIn 0.6s 0.2s ease both; opacity: 0; }
      .main-title { animation: fadeIn 0.7s 0.1s ease both; opacity: 0; }
      .stack { animation: fadeIn 0.6s 0.5s ease both; opacity: 0; }
      .d1 { animation: dotFade 2s 0s ease-in-out infinite; }
      .d2 { animation: dotFade 2s 0.4s ease-in-out infinite; }
      .d3 { animation: dotFade 2s 0.8s ease-in-out infinite; }
      .d4 { animation: dotFade 2s 1.2s ease-in-out infinite; }
      .d5 { animation: dotFade 2s 1.6s ease-in-out infinite; }
      .shimmer { animation: shimmerMove 3s 0.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="160" fill="url(#bgF)" rx="12"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#6366f1" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/><line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="150" y1="0" x2="150" y2="160"/><line x1="300" y1="0" x2="300" y2="160"/>
    <line x1="450" y1="0" x2="450" y2="160"/><line x1="600" y1="0" x2="600" y2="160"/>
    <line x1="750" y1="0" x2="750" y2="160"/>
  </g>

  <!-- Shimmer sweep -->
  <rect class="shimmer" x="-200" y="0" width="200" height="160" fill="url(#accentF)" opacity="0.03" rx="0"/>

  <!-- Ambient glow -->
  <ellipse cx="450" cy="75" rx="350" ry="60" fill="#6366f1" opacity="0.05" filter="url(#softF)"/>

  <!-- Subheading -->
  <g class="sub">
    <text x="450" y="38" font-family="monospace" font-size="11" fill="#6366f1" text-anchor="middle" letter-spacing="5" opacity="0.85">
      &lt; FULL STACK ENGINEERING &gt;
    </text>
  </g>

  <!-- Main title -->
  <g class="main-title">
    <text x="450" y="88" font-family="sans-serif" font-size="36" font-weight="900" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="2" filter="url(#glowF)">
      CRAFTING DIGITAL EXPERIENCES
    </text>
  </g>

  <!-- Tech stack dots -->
  <g class="stack">
    <text x="450" y="120" font-family="monospace" font-size="12" fill="#6b7280" text-anchor="middle" letter-spacing="1">
      <tspan class="d1" fill="#a5b4fc">Java</tspan>
      <tspan fill="#374151"> - </tspan>
      <tspan class="d2" fill="#a5b4fc">Spring Boot</tspan>
      <tspan fill="#374151"> - </tspan>
      <tspan class="d3" fill="#a5b4fc">Node.js</tspan>
      <tspan fill="#374151"> - </tspan>
      <tspan class="d4" fill="#a5b4fc">React</tspan>
      <tspan fill="#374151"> - </tspan>
      <tspan class="d5" fill="#a5b4fc">PostgreSQL - Docker</tspan>
    </text>
  </g>

  <!-- Accent bottom line with gradient -->
  <rect x="300" y="140" width="300" height="1.5" fill="url(#accentF)" rx="1" opacity="0.6"/>

  <!-- Corner accents -->
  <path d="M 0 20 L 0 0 L 20 0" fill="none" stroke="url(#accentF)" stroke-width="2" stroke-opacity="0.4" rx="4"/>
  <path d="M 880 0 L 900 0 L 900 20" fill="none" stroke="url(#accentF)" stroke-width="2" stroke-opacity="0.4"/>
  <path d="M 0 140 L 0 160 L 20 160" fill="none" stroke="url(#accentF)" stroke-width="2" stroke-opacity="0.4"/>
  <path d="M 880 160 L 900 160 L 900 140" fill="none" stroke="url(#accentF)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="899" height="159" rx="11.5" fill="none" stroke="url(#accentF)" stroke-opacity="0.15" stroke-width="1"/>
</svg>
