<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <style>
    .title { font-family: 'Inter', -apple-system, sans-serif; font-size: 34px; font-weight: 800; fill: #ffffff; letter-spacing: 2px; }
    .subtitle { font-family: 'Fira Code', monospace; font-size: 13px; fill: #38bdf8; letter-spacing: 5px; font-weight: 600; }
    .tech { font-family: 'Fira Code', monospace; font-size: 13px; fill: #94a3b8; letter-spacing: 1.5px; }
    
    /* Clean text soft glow */
    .glow-text { filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.25)); }
    
    /* Smooth scanning light animation that stays far away from text */
    .scan-line {
      stroke-dasharray: 100 300;
      animation: scan 6s linear infinite;
    }
    @keyframes scan {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: -400; }
    }
  </style>

  <defs>
    <!-- Premium Dark Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    
    <!-- Neon Gradient for Scanning Lines -->
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="850" height="250" rx="12" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12" />

  <!-- Safe Animated Borders (Completely away from text center) -->
  <g>
    <!-- Top Border Safe Line -->
    <line x1="40" y1="35" x2="810" y2="35" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="40" y1="35" x2="810" y2="35" stroke="url(#neon-glow)" stroke-width="2.5" class="scan-line"/>
    
    <!-- Bottom Border Safe Line -->
    <line x1="40" y1="215" x2="810" y2="215" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="40" y1="215" x2="810" y2="215" stroke="url(#neon-glow)" stroke-width="2.5" class="scan-line"/>
  </g>

  <!-- Central Clean Content Layout (100% Clear from animations) -->
  <g text-anchor="middle">
    
    <!-- Subtitle -->
    <text x="425" y="90" class="subtitle">&lt; FULL STACK ENGINEERING &gt;</text>
    
    <!-- Main Title -->
    <text x="425" y="140" class="title glow-text">CRAFTING DIGITAL EXPERIENCES</text>
    
    <!-- Tech Stack Line -->
    <text x="425" y="180" class="tech">Java • Spring Boot • Node.js • React • PostgreSQL • Docker</text>

  </g>
</svg>
