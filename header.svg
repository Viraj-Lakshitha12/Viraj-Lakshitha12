<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<style>
@keyframes float1{0%,100%{transform:translateY(0px)}50%{transform:translateY(-11px)}}
@keyframes float2{0%,100%{transform:translateY(0px)}50%{transform:translateY(-15px)}}
@keyframes float3{0%,100%{transform:translateY(0px)}50%{transform:translateY(-8px)}}
@keyframes scan{0%{transform:translateY(-5px);opacity:0}8%{opacity:.45}92%{opacity:.18}100%{transform:translateY(345px);opacity:0}}
@keyframes kenb{0%,100%{transform:scale(1) translate(0px,0px)}50%{transform:scale(1.04) translate(-7px,-3px)}}
@keyframes pulse1{0%,100%{opacity:.07}50%{opacity:.17}}
@keyframes pulse2{0%,100%{opacity:.05}50%{opacity:.13}}
@keyframes fall1{0%{transform:translateY(-30px);opacity:0}12%{opacity:.55}88%{opacity:.08}100%{transform:translateY(360px);opacity:0}}
@keyframes fall2{0%{transform:translateY(-30px);opacity:0}18%{opacity:.38}82%{opacity:.05}100%{transform:translateY(360px);opacity:0}}
@keyframes dash{0%{stroke-dashoffset:60}100%{stroke-dashoffset:0}}
.f1{animation:float1 4.3s ease-in-out infinite}
.f2{animation:float2 5.9s ease-in-out infinite -1.6s}
.f3{animation:float3 4.0s ease-in-out infinite -2.3s}
.f4{animation:float1 6.2s ease-in-out infinite -0.9s}
.f5{animation:float2 4.8s ease-in-out infinite -3.2s}
.f6{animation:float3 5.4s ease-in-out infinite -1.9s}
.f7{animation:float1 3.6s ease-in-out infinite -0.5s}
.sl{animation:scan 9s linear infinite}
.kb{animation:kenb 22s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.p1{animation:pulse1 6s ease-in-out infinite}
.p2{animation:pulse2 8s ease-in-out infinite -3s}
.p3{animation:pulse1 7s ease-in-out infinite -4s}
.fa{animation:fall1 5.2s linear infinite}
.fb{animation:fall2 7.1s linear infinite}
.fc{animation:fall1 4.3s linear infinite -2.1s}
.fd{animation:fall2 6.2s linear infinite -1.1s}
.fe{animation:fall1 8.3s linear infinite -3.7s}
.da{animation:dash 3s linear infinite}
.db{animation:dash 4.5s linear infinite -1.5s}
</style>
<radialGradient id="rg" cx="48%" cy="42%" r="68%">
  <stop offset="0%" stop-color="#081e2a"/>
  <stop offset="55%" stop-color="#05090f"/>
  <stop offset="100%" stop-color="#030508"/>
</radialGradient>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#a7f3d0"/>
  <stop offset="100%" stop-color="#5eead4"/>
</linearGradient>
<linearGradient id="lg" x1="0" y1="0" x2="0.5" y2="1">
  <stop offset="0%" stop-color="#0e7490"/>
  <stop offset="100%" stop-color="#134e64"/>
</linearGradient>
<linearGradient id="rg2" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#164e63"/>
  <stop offset="100%" stop-color="#083344"/>
</linearGradient>
<linearGradient id="fb" x1="0" y1="0" x2="0" y2="1">
  <stop offset="28%" stop-color="#030508" stop-opacity="0"/>
  <stop offset="100%" stop-color="#030508" stop-opacity="1"/>
</linearGradient>
<linearGradient id="ft" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#030508" stop-opacity="1"/>
  <stop offset="28%" stop-color="#030508" stop-opacity="0"/>
</linearGradient>
<linearGradient id="fl" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#030508" stop-opacity=".65"/>
  <stop offset="22%" stop-color="#030508" stop-opacity="0"/>
</linearGradient>
<linearGradient id="fr" x1="0" y1="0" x2="1" y2="0">
  <stop offset="78%" stop-color="#030508" stop-opacity="0"/>
  <stop offset="100%" stop-color="#030508" stop-opacity=".65"/>
</linearGradient>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
  <path d="M44 0L0 0L0 44" fill="none" stroke="#5eead4" stroke-width="0.22" stroke-opacity="0.13"/>
</pattern>
</defs>

<!-- Static dark base -->
<rect width="900" height="340" fill="url(#rg)"/>

<!-- Ken Burns layer: grid + glow spots -->
<g class="kb">
  <rect width="900" height="340" fill="url(#grid)" opacity="0.8"/>
  <ellipse cx="195" cy="155" rx="145" ry="110" fill="#0e7490" class="p1"/>
  <ellipse cx="710" cy="130" rx="120" ry="95" fill="#5eead4" class="p2"/>
  <ellipse cx="470" cy="310" rx="180" ry="70" fill="#0e7490" class="p3"/>
</g>

<!-- Falling code chars (very subtle) -->
<g font-family="'Courier New',Courier,monospace" font-size="11" fill="#5eead4">
  <text class="fa" x="28"  y="-20" opacity="0.16">01</text>
  <text class="fb" x="115" y="-55" opacity="0.13">{ }</text>
  <text class="fc" x="745" y="-18" opacity="0.15">API</text>
  <text class="fd" x="825" y="-48" opacity="0.12">0x</text>
  <text class="fe" x="858" y="-28" opacity="0.14">TS</text>
  <text class="fa" x="866" y="-8"  opacity="0.11" style="animation-delay:-3.6s">JS</text>
  <text class="fb" x="38"  y="-88" opacity="0.10" style="animation-delay:-4.6s">10</text>
  <text class="fc" x="885" y="-68" opacity="0.13" style="animation-delay:-1.6s">SQL</text>
</g>

<!-- ═══════════ FLOATING CUBES ═══════════ -->

<!-- Cube 1: Large (edge=50) — left center — teal full opacity -->
<g class="f1">
  <polygon points="70,120 120,95 170,120 120,145" fill="url(#tg)" opacity="0.78"/>
  <polygon points="70,120 120,145 120,195 70,170" fill="url(#lg)" opacity="0.82"/>
  <polygon points="120,145 170,120 170,170 120,195" fill="url(#rg2)" opacity="0.85"/>
  <polygon points="70,120 120,95 170,120 120,145" fill="none" stroke="#5eead4" stroke-width="0.65" stroke-opacity="0.72"/>
  <polygon points="70,120 120,145 120,195 70,170" fill="none" stroke="#5eead4" stroke-width="0.4" stroke-opacity="0.35"/>
  <polygon points="120,145 170,120 170,170 120,195" fill="none" stroke="#5eead4" stroke-width="0.4" stroke-opacity="0.35"/>
</g>

<!-- Cube 2: Largest (edge=60) — right upper -->
<g class="f2">
  <polygon points="700,75 760,45 820,75 760,105" fill="url(#tg)" opacity="0.72"/>
  <polygon points="700,75 760,105 760,165 700,135" fill="url(#lg)" opacity="0.77"/>
  <polygon points="760,105 820,75 820,135 760,165" fill="url(#rg2)" opacity="0.80"/>
  <polygon points="700,75 760,45 820,75 760,105" fill="none" stroke="#5eead4" stroke-width="0.65" stroke-opacity="0.68"/>
  <polygon points="700,75 760,105 760,165 700,135" fill="none" stroke="#5eead4" stroke-width="0.4" stroke-opacity="0.32"/>
  <polygon points="760,105 820,75 820,135 760,165" fill="none" stroke="#5eead4" stroke-width="0.4" stroke-opacity="0.32"/>
</g>

<!-- Cube 3: Medium (edge=32) — right center -->
<g class="f3">
  <polygon points="608,182 640,166 672,182 640,198" fill="url(#tg)" opacity="0.66"/>
  <polygon points="608,182 640,198 640,230 608,214" fill="url(#lg)" opacity="0.70"/>
  <polygon points="640,198 672,182 672,214 640,230" fill="url(#rg2)" opacity="0.73"/>
  <polygon points="608,182 640,166 672,182 640,198" fill="none" stroke="#5eead4" stroke-width="0.5" stroke-opacity="0.62"/>
</g>

<!-- Cube 4: Small (edge=26) — left lower -->
<g class="f4">
  <polygon points="224,202 250,189 276,202 250,215" fill="url(#tg)" opacity="0.60"/>
  <polygon points="224,202 250,215 250,241 224,228" fill="url(#lg)" opacity="0.64"/>
  <polygon points="250,215 276,202 276,228 250,241" fill="url(#rg2)" opacity="0.67"/>
  <polygon points="224,202 250,189 276,202 250,215" fill="none" stroke="#5eead4" stroke-width="0.5" stroke-opacity="0.56"/>
</g>

<!-- Cube 5: Medium (edge=40) — upper center-right -->
<g class="f5">
  <polygon points="400,58 440,38 480,58 440,78" fill="url(#tg)" opacity="0.74"/>
  <polygon points="400,58 440,78 440,118 400,98" fill="url(#lg)" opacity="0.78"/>
  <polygon points="440,78 480,58 480,98 440,118" fill="url(#rg2)" opacity="0.81"/>
  <polygon points="400,58 440,38 480,58 440,78" fill="none" stroke="#5eead4" stroke-width="0.6" stroke-opacity="0.70"/>
</g>

<!-- Cube 6: Small (edge=22) — far right -->
<g class="f6">
  <polygon points="828,198 850,187 872,198 850,209" fill="url(#tg)" opacity="0.50"/>
  <polygon points="828,198 850,209 850,231 828,220" fill="url(#lg)" opacity="0.54"/>
  <polygon points="850,209 872,198 872,220 850,231" fill="url(#rg2)" opacity="0.57"/>
</g>

<!-- Cube 7: Mini (edge=19) — far left lower -->
<g class="f7">
  <polygon points="36,268 55,258 74,268 55,278" fill="url(#tg)" opacity="0.44"/>
  <polygon points="36,268 55,278 55,297 36,287" fill="url(#lg)" opacity="0.48"/>
  <polygon points="55,278 74,268 74,287 55,297" fill="url(#rg2)" opacity="0.51"/>
</g>

<!-- Cube 8: Tiny (edge=15) — upper left -->
<g class="f3" style="animation-delay:-1.1s">
  <polygon points="295,42 310,34 325,42 310,50" fill="url(#tg)" opacity="0.38"/>
  <polygon points="295,42 310,50 310,65 295,57" fill="url(#lg)" opacity="0.42"/>
  <polygon points="310,50 325,42 325,57 310,65" fill="url(#rg2)" opacity="0.44"/>
</g>

<!-- ═══════════ CIRCUIT TRACES ═══════════ -->
<g stroke="#5eead4" fill="none" stroke-opacity="0.22">
  <path d="M0 222 L62 222 L62 188 L128 188" stroke-width="0.9" stroke-dasharray="5 11" class="da"/>
  <path d="M900 112 L838 112 L838 148 L774 148" stroke-width="0.9" stroke-dasharray="5 11" class="db"/>
  <path d="M0 292 L82 292 L82 262" stroke-width="0.7" stroke-dasharray="4 9" class="da" style="animation-delay:-.8s"/>
  <path d="M900 262 L822 262 L822 296 L762 296" stroke-width="0.7" stroke-dasharray="4 9" class="db" style="animation-delay:-2s"/>
  <circle cx="62"  cy="222" r="2.2" fill="#5eead4" stroke="none" opacity="0.4"/>
  <circle cx="838" cy="148" r="2.2" fill="#5eead4" stroke="none" opacity="0.4"/>
</g>

<!-- Scan line -->
<rect class="sl" x="0" y="0" width="900" height="1.8" fill="#5eead4" fill-opacity="0.28" rx="0.9"/>

<!-- Gradient vignettes -->
<rect width="900" height="340" fill="url(#fb)"/>
<rect width="900" height="340" fill="url(#ft)"/>
<rect width="900" height="340" fill="url(#fl)"/>
<rect width="900" height="340" fill="url(#fr)"/>

<!-- ═══════════ TEXT ═══════════ -->
<text x="450" y="232"
  text-anchor="middle"
  font-family="'Courier New',Courier,monospace"
  font-size="12" fill="#5eead4" letter-spacing="5.5" opacity="0.90">
  PROFILE README · 2026
</text>

<text x="450" y="282"
  text-anchor="middle"
  font-family="Georgia,'Times New Roman',serif"
  font-size="54" fill="#f1f5f9" font-weight="700" letter-spacing="-1.5">
  Viraj Lakshitha
</text>

<text x="450" y="313"
  text-anchor="middle"
  font-family="'Courier New',Courier,monospace"
  font-size="13" fill="#94a3b8" letter-spacing="1.8">
  Full Stack Software Engineer · INTELLEON
</text>
</svg>
